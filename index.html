<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b2447" />
    <meta
      name="description"
      content="Зимние бомберы для студентов КБТУ. Выбери школу, посмотри куртку в 3D и оставь предзаказ в Алматы."
    />
    <title>КБТУ Варсити — зимние куртки для каждой школы КБТУ</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts: preconnect + swap so text is never blocked on the font download -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Graduate&family=Manrope:wght@400;500;600;700;800&family=Marck+Script&family=Unbounded:wght@700&display=swap"
    />

    <!-- LCP candidate: hero photo -->
    <link
      rel="preload"
      as="image"
      href="/img/jacket-sample-896.jpg"
      imagesrcset="/img/jacket-sample-480.jpg 480w, /img/jacket-sample-896.jpg 896w"
      imagesizes="(min-width: 1024px) 40vw, 90vw"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
